services:
  - type: web
    name: makola-2
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_LEVEL
        value: error
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://makola-2.onrender.com
      - key: FRONTEND_URL
        value: https://blue-space-app.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://blue-space-app.netlify.app
      - key: SANCTUM_STATEFUL_DOMAINS
        value: blue-space-app.netlify.app
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: makola-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # ── Mail (Gmail SMTP) Configuration ─────────────────────────
      # ⚠️ IMPORTANT: Replace with your actual Gmail App Password.
      #    For Gmail: Enable 2FA, generate an App Password at:
      #    https://myaccount.google.com/apppasswords
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Makola

databases:
  - name: makola-db
    plan: free
    databaseName: makola
    user: makola
