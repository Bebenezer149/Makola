services:
  - type: web
    name: makola-2
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_LEVEL
        value: error
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://makola-2.onrender.com
      - key: FRONTEND_URL
        value: https://blue-space-gh.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://blue-space-gh.vercel.app
      - key: SANCTUM_STATEFUL_DOMAINS
        value: blue-space-gh.vercel.app
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: makola-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # ── Mail (Resend) Configuration ─────────────────────────────
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: BlueSpace

databases:
  - name: makola-db
    plan: free
    databaseName: makola
    user: makola
